[package]
name = "gaze"
version = "0.1.0"
edition = "2021"
description = "A camera app for the Linux desktop: GTK 4, libadwaita and GStreamer, following the Omarchy theme"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
gst = { package = "gstreamer", version = "0.25" }
gst-video = { package = "gstreamer-video", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
log = "0.4"
env_logger = "0.11"
rxing = { version = "0.9.3", default-features = false, features = ["decoders", "multi_barcode_readers", "qrcode", "datamatrix", "oned", "aztec", "pdf417", "encoding_rs"] }
async-channel = "2.5.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
